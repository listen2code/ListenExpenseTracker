# --- 这是一个 Version Catalog 文件，用于统一管理项目中所有的依赖版本、库定义和插件 ---
# 作用：1. 集中配置版本号。 2. 为库起别名，在 build.gradle 中通过 libs.<别名> 引用，提供代码补全。
# 注意：在 build.gradle 中引用时，别名中的 "-" 会变成 "." (例如 androidx-core-ktx 变成 libs.androidx.core.ktx)

[versions]
# 这里定义所有的版本号常量。
agp = "9.2.1"                           # Android Gradle Plugin
coreKtx = "1.12.0"                      # Kotlin 核心扩展（兼容 compileSdk 36）
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
activityCompose = "1.8.0"
lifecycleRuntimeKtx = "2.7.0"           # 生命周期扩展（兼容 compileSdk 36）
lifecycleViewmodelCompose = "2.7.0"
kotlin = "2.2.10"                       # Kotlin 核心语言版本（与 KSP 2.2.10-2.0.2 严格对齐，消除版本过旧警告）
composeBom = "2026.02.01"               # Compose BOM (统一版本管理)
googleGmsGoogleServices = "4.5.0"
material3 = "1.4.0"
biometric = "1.2.0-alpha05"             # 生物识别库版本
aboutlibraries = "11.2.3"               # 关于页第三方许可库
room = "2.8.4"                          # Room 数据库版本
credentials = "1.3.0"                   # Android 凭据管理
googleid = "1.1.1"                      # Google ID 登录凭据库
playServicesAuthBase = "18.0.10"        # Google Play 底层授权服务 (独立于已废弃的 play-services-auth，提供轻量级 GoogleAuthUtil)
coreSplashscreen = "1.0.1"              # 官方启动屏兼容库
coil = "2.6.0"                          # Coil 异步图片加载
json = "20240303"                       # 测试用 JSON 库
coroutinesTest = "1.8.0"                # 协程单元测试
mockitoCore = "5.11.0"                  # Mockito 测试框架
mockitoKotlin = "5.2.1"                 # Mockito Kotlin 封装
work = "2.9.0"                          # WorkManager 后台离线任务调度库

[libraries]
# 这里定义具体的依赖库别名及其坐标 (group:name)。
# 定义在这里只是“注册”了这些库，只有在子模块的 build.gradle.kts 中引入后才会真正下载。

# 关于页面库 (Material 3 版本)
aboutlibraries-compose-m3 = { group = "com.mikepenz", name = "aboutlibraries-compose-m3", version.ref = "aboutlibraries" }
# Android 生物识别认证 (指纹、面部识别)
androidx-biometric = { group = "androidx.biometric", name = "biometric", version.ref = "biometric" }
# Kotlin 核心 KTX 扩展，提供更简洁的 Kotlin 语法支持
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }

# 测试工具
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
json = { group = "org.json", name = "json", version.ref = "json" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutinesTest" }
mockito-core = { group = "org.mockito", name = "mockito-core", version.ref = "mockitoCore" }
mockito-kotlin = { group = "org.mockito.kotlin", name = "mockito-kotlin", version.ref = "mockitoKotlin" }

# 生命周期、ViewModel 以及 Activity 的 Compose 适配
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleViewmodelCompose" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

# Jetpack Compose 系列组件
# 使用 BOM (Bill of Materials) 可以确保所有 Compose 组件相互兼容，无需为每个组件写版本号
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

# Room 数据库
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

# 认证与凭据 (Google Auth)
androidx-credentials = { group = "androidx.credentials", name = "credentials", version.ref = "credentials" }
androidx-credentials-play-services-auth = { group = "androidx.credentials", name = "credentials-play-services-auth", version.ref = "credentials" }
google-android-libraries-identity-googleid = { group = "com.google.android.libraries.identity.googleid", name = "googleid", version.ref = "googleid" }
play-services-auth-base = { group = "com.google.android.gms", name = "play-services-auth-base", version.ref = "playServicesAuthBase" }

# 核心系统 UI 与多媒体
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "coreSplashscreen" }
coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }

# WorkManager 后台任务调度
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
androidx-work-testing = { group = "androidx.work", name = "work-testing", version.ref = "work" }

[plugins]
# 这里声明项目中使用的 Gradle 插件别名及其 ID。
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
google-gms-google-services = { id = "com.google.gms.google-services", version.ref = "googleGmsGoogleServices" }
ksp = { id = "com.google.devtools.ksp", version = "2.2.10-2.0.2" }
aboutlibraries = { id = "com.mikepenz.aboutlibraries.plugin", version.ref = "aboutlibraries" }
