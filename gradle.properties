# 项目范围的 Gradle 设置。
# Android Studio 等 IDE 会优先使用其自身的设置，可能会覆盖此文件中的配置。

# --- 基础与 JVM 配置 ---
# org.gradle.jvmargs: 指定 Gradle 守护进程 (Daemon) 的 JVM 参数。
# -Xmx2048m: 设置最大堆内存。Android 编译（处理图片、Kotlin 编译）非常吃内存。
# 2048M 是黄金平衡点，设置太大会抢占系统内存导致电脑卡顿，太小会导致频繁 GC 变慢甚至 OOM 崩溃。
# -Dfile.encoding=UTF-8: 强制使用 UTF-8 字符编码，避免跨平台开发时的乱码问题。
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# --- 性能优化：编译加速 ---
# org.gradle.parallel: 并行编译选项。
# 开启后，Gradle 会并行执行相互独立的子项目任务。在当前的多模块架构下，
# 它可以同时编译 app、arch 和 ui 模块，通常能减少 20% - 40% 的构建时间。
org.gradle.parallel=true

# org.gradle.caching: 构建缓存 (Build Cache)。
# 区别于配置缓存，它缓存的是任务的“执行结果”（如编译好的 .class 文件）。
# 当代码逻辑未变时，直接复用结果，显著减少“执行阶段”的耗时。
org.gradle.caching=true

# org.gradle.configuration-cache: 配置缓存。
# 缓存的是 Gradle 的“配置结果”（解析 build.gradle 得到的任务图）。
# 开启后，点击“运行”按钮会直接跳过冗长的配置阶段，让构建启动速度从几秒缩短至亚秒级。
org.gradle.configuration-cache=true

# org.gradle.vfs.watch: 文件系统监视 (VFS Watch)。
# 让 Gradle 持续监控文件系统变化，避免每次构建时重新扫描整个项目，提升文件检索效率。
org.gradle.vfs.watch=true

# --- Android 架构与资源优化 ---
# android.useAndroidX: 强制使用 AndroidX。这是现代 Android 开发的标准。
android.useAndroidX=true

# android.enableJetifier: 禁用 Jetifier。
# Jetifier 是为了兼容古老的 Support 库。既然本项目是纯 AndroidX 环境，
# 关闭它可以省去每次编译时扫描和转换依赖包的时间，相当于拆掉了编译流程中的“安检站”。
android.enableJetifier=false

# android.nonTransitiveRClass: 非传递性 R 类。
# R 类是 Android 资源的数字索引。开启后，app 的 R 类不再包含依赖库（如 ui 模块）的资源 ID。
# 影响：库模块的资源变动不会导致主模块代码的大规模重新编译，大幅提升多模块项目的增量编译速度。
android.nonTransitiveRClass=true

# --- 开发规范与其它 ---
# kotlin.code.style: 项目的 Kotlin 代码风格。"official" 代表使用官方推荐的代码风格。
# 它会影响 IDE 的代码格式化行为 (Ctrl+Alt+L) 和代码检查 (Lint)，确保团队协作时代码风格统一。
kotlin.code.style=official

# android.disallowKotlinSourceSets: 禁用传统的 Kotlin 源集结构。
# 强制项目遵循现代 Android 标准的代码路径组织方式（如 src/main/java），
# 避免因新旧配置混用导致的任务冲突或构建变慢。
android.disallowKotlinSourceSets=false

# kapt.incremental.apt: 开启 Kapt 增量处理。
# 如果项目中使用了 Room、Dagger/Hilt 等注解处理器，开启后会让代码生成（APT）过程变快。
kapt.incremental.apt=true
